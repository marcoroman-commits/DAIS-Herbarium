<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herbarium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,500;0,600;1,400;1,500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>

:root{
  --paper:#EEF3F4; --surface:#FAFCFC; --ink:#0A3F51; --muted:#56717B; --rule:#CBDADE;
  --accent:#0F597B; --accent-soft:#DDEBEF;
  --sea:#D9E2E2; --land:#F4F5F0; --border:#B3BDB2; --label:#6E7A71;
  --gps:#C2410C; --loc:#4F8A45; --prov:#CFA530; --stato:#0F597B;
  --sel:#0A3F51;
  --desc-grad:linear-gradient(90deg,#CFA530 0%,#A5AE48 25%,#6E9A4E 50%,#1D6676 75%,#0F597B 100%);
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0B1D25; --surface:#10262F; --ink:#E1ECEF; --muted:#93AEB7; --rule:#23424D;
    --accent:#6FB6D4; --accent-soft:#16384A;
    --sea:#141E1E; --land:#212924; --border:#3B463F; --label:#8A968E;
    --gps:#FB8B5B; --loc:#9CC36A; --prov:#E3BB4A; --stato:#6FB6D4; --sel:#FFFFFF;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0B1D25; --surface:#10262F; --ink:#E1ECEF; --muted:#93AEB7; --rule:#23424D;
  --accent:#6FB6D4; --accent-soft:#16384A;
  --sea:#141E1E; --land:#212924; --border:#3B463F; --label:#8A968E;
  --gps:#FB8B5B; --loc:#9CC36A; --prov:#E3BB4A; --stato:#6FB6D4; --sel:#FFFFFF;
}
html,body{height:100%;margin:0}
.mono{font-family:var(--mono)}
#src{font-size:11.5px;color:var(--muted)}
.basemap-topo{filter:brightness(1.06) contrast(.82) opacity(.54);mix-blend-mode:multiply}
.basemap-sat{filter:brightness(1.14) contrast(.80)}
#map.relief-active{background:#DEE8D7}
.contour-notice{position:absolute;left:12px;bottom:108px;z-index:450;padding:6px 9px;background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:3px;font-size:12px;pointer-events:none;max-width:230px}
.leaflet-control-layers{background:var(--surface)!important;color:var(--ink);border:1px solid var(--rule)!important;box-shadow:none!important;font-size:12.5px}
.leaflet-control-layers-toggle{background-image:none!important;width:auto!important;height:auto!important;padding:5px 9px;font-size:12.5px;color:var(--ink)!important;text-decoration:none}
.leaflet-control-layers-toggle::after{content:attr(data-label)}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;}
header.top{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:10px 18px 12px;border-bottom:1px solid var(--rule);background:var(--surface)}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--desc-grad)}
.logo{display:block;height:52px;width:auto;background:#fff;border-radius:4px;padding:2px 4px}
.titles{display:grid;gap:1px}
header.top h1{margin:0;font-family:var(--sans);font-weight:700;font-size:24px;letter-spacing:.1px;line-height:1.1}
header.top h1 i{font-family:var(--serif);font-weight:500;color:var(--loc)}
header.top .sub{color:var(--muted);font-size:13px}
header.top .counts{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
header.top .counts b{color:var(--ink);font-weight:500}
.main{display:grid;grid-template-columns:minmax(300px,380px) 1fr;min-height:0}
aside{border-right:1px solid var(--rule);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.filters{padding:14px 16px;border-bottom:1px solid var(--rule);display:grid;gap:10px}
.field{display:grid;gap:4px}
.field label,.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
#boxFilter[hidden]{display:none}
input[type=search],input[type=number],select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:6px 8px;width:100%;box-sizing:border-box}
input:focus-visible,select:focus-visible,button:focus-visible,.place:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.years{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.field label.chip{text-transform:none;letter-spacing:0;font-size:12px;color:var(--ink);font-weight:400}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--rule);border-radius:999px;padding:3px 10px 3px 7px;cursor:pointer;user-select:none;background:var(--paper)}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.chip:has(input:not(:checked)){opacity:.45}
.chip:has(input:not(:checked)) .dot{background:transparent!important;border:1.5px solid currentColor}
.chip:has(input:focus-visible){outline:2px solid var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:12.5px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
.panel{overflow:auto;padding:14px 16px 24px;display:grid;gap:14px;align-content:start;min-height:0}
.panel h2{margin:0;font-family:var(--serif);font-weight:600;font-size:19px;text-wrap:balance}
.panel h3{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
.note{font-size:12.5px;color:var(--muted)}
.prec{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;border-radius:3px;padding:1px 7px;border:1px solid currentColor}
.prec.gps{color:var(--gps)}.prec.loc{color:var(--loc)}.prec.prov{color:var(--prov)}.prec.stato{color:var(--stato)}
.bars{display:grid;gap:4px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:12.5px;cursor:pointer;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
.bar:hover{color:var(--accent)}
.bar .t{position:relative;padding:3px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar .t span{position:relative}
.bar .t::before{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--accent-soft);border-left:3px solid var(--loc);border-radius:2px}
.bar .n{font-family:var(--mono);font-size:12px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.places{display:grid;gap:0}
.place{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--rule);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;border-radius:0;text-align:left;font-size:13px}
.place:hover{background:var(--accent-soft);color:var(--ink)}
.place .dot{width:9px;height:9px;border-radius:50%}
.place .n{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.specs{display:grid;gap:0}
details.sp{border-bottom:1px solid var(--rule)}
details.sp summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:7px 2px}
details.sp summary::-webkit-details-marker{display:none}
details.sp summary:hover .bn{color:var(--accent)}
.bn{font-family:var(--serif);font-style:italic;font-size:15.5px}
.bn small{font-style:normal;font-family:var(--sans);font-size:11.5px;color:var(--muted);margin-left:4px}
.meta{grid-column:1/-1;font-size:12px;color:var(--muted)}
.box{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--rule);border-radius:3px;padding:0 5px;align-self:start;margin-top:3px;white-space:nowrap}
dl.label{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0 0 10px;padding:99px 11px;font-size:12.5px;background:var(--paper);border:1px solid var(--rule);border-radius:3px}
dl.label dt{color:var(--muted)}dl.label dd{margin:0;overflow-wrap:anywhere}
.more{justify-self:start}
.back{justify-self:start}
.mapwrap{position:relative;min-height:0}
#map{position:absolute;inset:0;background:var(--sea)}
.leaflet-container{font-family:var(--sans);background:var(--sea)}
.legend{position:absolute;right:12px;bottom:14px;z-index:500;background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:8px 10px;font-size:12px;display:grid;gap:4px;max-width:220px}
.legend .i{display:flex;align-items:center;gap:7px}
.legend .dot{width:10px;height:10px;border-radius:50%;flex:none}
.legend .s{color:var(--muted);font-size:11px;margin-top:2px}
.mapbtns{position:absolute;right:12px;top:12px;z-index:500;display:flex;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 80px);gap:6px}
.mapbtns button{background:var(--surface)}
.mapbtns button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.area-drawing,.area-drawing .leaflet-interactive{cursor:crosshair!important}
.area-drawing{touch-action:none}
.city{font-size:11px;color:var(--label);white-space:nowrap;letter-spacing:.02em;font-family:var(--sans);text-shadow:0 0 3px var(--land),0 0 3px var(--land)}
.city::before{content:"";display:inline-block;width:3px;height:3px;background:var(--label);border-radius:50%;margin-right:4px;vertical-align:middle}
.leaflet-tooltip.tt{background:var(--surface);color:var(--ink);border:1px solid var(--rule);box-shadow:none;font-size:12px;border-radius:3px}
.leaflet-tooltip.tt::before{display:none}
.leaflet-control-zoom a{background:var(--surface)!important;color:var(--ink)!important;border-color:var(--rule)!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 80%,transparent)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--muted)!important}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
#reload{background:var(--accent);color:var(--surface);border-color:var(--accent)}
#reload:hover{filter:brightness(1.1);color:var(--surface)}
@media (max-width:760px){
  .logo{height:40px}
  .app{height:auto}
  .main{grid-template-columns:1fr}
  .mapwrap{order:-1;height:58vh;min-height:320px;border-bottom:1px solid var(--rule)}
  aside{border-right:0}
  .panel{overflow:visible}
  header.top .counts{margin-left:0}
  .legend{bottom:10px;right:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- azioni, foto, inserimento ---- */
button.primary{background:var(--accent);color:var(--surface);border-color:var(--accent);font-weight:600}
button.primary:hover{filter:brightness(1.1);color:var(--surface)}
button:disabled{opacity:.55;cursor:progress}
header.top #newRec{padding:7px 12px;font-size:13px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:12px;cursor:pointer}
.phn{display:inline-block;margin-left:4px;font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:0 5px}
.photos{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.ph{margin:0;flex:none;width:150px;display:grid;gap:3px}
.ph img{width:150px;height:112px;object-fit:cover;border-radius:3px;border:1px solid var(--rule);background:var(--paper);display:block}
.ph figcaption{font-size:10.5px;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.sp-actions{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.sp-actions button{font-size:12px;padding:4px 8px}
.psearch{border:1px solid var(--rule);border-radius:4px;padding:10px;margin:0 0 12px;background:var(--paper);display:grid;gap:8px}
.psh{display:flex;justify-content:space-between;align-items:center}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.pc{margin:0;display:grid;gap:4px;align-content:start}
.pc img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:3px;border:1px solid var(--rule);background:var(--surface);display:block;max-width:100%}
.pc figcaption{font-size:11px;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.pc figcaption b{color:var(--ink);font-weight:600}
.pc button{font-size:11.5px;padding:3px 6px}
.rform{display:grid;gap:14px}
.rform .fh{display:grid;gap:4px}
.rform fieldset{border:1px solid var(--rule);border-radius:4px;padding:10px 12px 12px;margin:0;display:grid;gap:8px;background:var(--paper)}
.rform legend{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600;padding:0 4px}
.rform input:not([type=checkbox]),.rform textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:6px 8px;width:100%;box-sizing:border-box}
.rform textarea{resize:vertical}
.rform input:focus-visible,.rform textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#f-pick.on{background:var(--gps);border-color:var(--gps);color:#fff}
.fthumbs{display:flex;flex-wrap:wrap;gap:8px}
.fthumbs figure{margin:0;display:grid;gap:2px;justify-items:start}
.fthumbs img{width:96px;height:72px;object-fit:cover;border-radius:3px;border:1px solid var(--rule)}
.err{margin:0;color:#B42318;font-size:13px}
.actions.sticky{position:sticky;bottom:0;background:var(--surface);padding:10px 0 4px;border-top:1px solid var(--rule)}
.picking{cursor:crosshair!important}
.picking .leaflet-interactive{cursor:crosshair!important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:2000;background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:5px;font-size:13px;max-width:min(520px,calc(100% - 32px));box-shadow:0 6px 20px rgba(0,0,0,.18)}
.toast.err{background:#B42318;color:#fff}
@media (max-width:520px){.row3{grid-template-columns:1fr 1fr}}
aside.formmode .filters{display:none}
.fatal{position:fixed;left:12px;right:12px;top:12px;z-index:3000;background:#B42318;color:#fff;padding:10px 14px;border-radius:5px;font-size:13px}
.editinfo{margin:0;font-size:12px;color:var(--ink);background:var(--accent-soft);border-left:3px solid var(--prov);padding:6px 8px;border-radius:3px}
.pc.broken{display:none}
.logo{width:104px;object-fit:contain;overflow:hidden}
@media (max-width:760px){.logo{width:80px}}
.role{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:3px 10px;border:1px solid currentColor;white-space:nowrap}
.role.rw{color:var(--loc)}
.role.ro{color:var(--muted)}
.langbtn{font-weight:600;font-size:12px;letter-spacing:.06em;padding:5px 9px;min-width:38px}
header.top button{white-space:nowrap;flex:none}
.signin{font-size:12.5px;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:5px 10px;text-decoration:none;white-space:nowrap}
.signin:hover{background:var(--accent);color:var(--surface)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <img class="logo" src="https://www.unive.it/web/fileadmin/user_upload/img/loghi/logoDESC.png" width="104" height="52" onerror="this.hidden=true" alt="DESC">
    <div class="titles"><h1>Herbarium</h1>
    <span class="sub" data-i18n="subtitle">Campioni d'erbario geolocalizzati per sito di raccolta · DAIS, Ca' Foscari University of Venice</span></div>
    <div class="counts" id="counts"></div>
    <span id="role" class="role" hidden></span>
    <button type="button" id="pinBtn" class="signin">Modalità Editor</button>
    <button type="button" class="langbtn" id="langBtn">EN</button>
    <button type="button" class="primary" id="newRec" data-i18n="newRec" hidden>+ Nuovo campione</button>
  </header>
  <div class="main">
    <aside>
      <form class="filters" id="filters" autocomplete="off">
        <div class="field">
          <label for="q" data-i18n="search">Cerca</label>
          <input type="search" id="q" data-i18n-ph="searchPh" placeholder="Specie, genere, famiglia, località, raccoglitore…">
        </div>
        <div class="row2">
          <div class="field"><label for="fam" data-i18n="family">Famiglia</label><select id="fam"></select></div>
          <div class="field"><label for="leg" data-i18n="legit">Legit</label><select id="leg"></select></div>
        </div>
        <div class="row2" id="collectionFilters" style="grid-template-columns:1fr">
          <div class="field" id="boxFilter" hidden><label for="box" data-i18n="box">Scatola</label><select id="box"></select></div>
          <div class="field"><span class="lbl" data-i18n="year">Anno di raccolta</span>
            <div class="years"><input type="number" id="y0" data-i18n-aria="from" aria-label="Dal"><span>–</span><input type="number" id="y1" data-i18n-aria="to" aria-label="Al"></div>
          </div>
        </div>
        <div class="field"><span class="lbl" data-i18n="precision">Precisione della posizione</span>
          <div class="chips">
            <label class="chip"><input type="checkbox" id="p-gps" checked><span class="dot" style="background:var(--gps)"></span><span data-i18n="pGps">GPS</span></label>
            <label class="chip"><input type="checkbox" id="p-loc" checked><span class="dot" style="background:var(--loc)"></span><span data-i18n="pLoc">Località</span></label>
            <label class="chip"><input type="checkbox" id="p-prov" checked><span class="dot" style="background:var(--prov)"></span><span data-i18n="pProv">Provincia</span></label>
            <label class="chip"><input type="checkbox" id="p-stato" checked><span class="dot" style="background:var(--stato)"></span><span data-i18n="pStato">Stato</span></label>
          </div>
        </div>
        <div class="chips"><label class="chip"><input type="checkbox" id="p-photo"><span class="dot" style="background:var(--accent)"></span><span data-i18n="onlyPhoto">Solo campioni con foto</span></label></div>
        <div class="actions"><button type="button" id="reset" data-i18n="reset">Azzera filtri</button><button type="button" id="reload" data-i18n="reload">Aggiorna dati dal foglio</button></div>
        <div id="src"></div>
        <p id="editinfo" class="editinfo" hidden></p>
      </form>
      <div class="panel" id="panel"></div>
    </aside>
    <div class="mapwrap">
      <div id="map" role="region" data-i18n-aria="mapAria" aria-label="Mappa dei siti di raccolta"></div>
      <div class="mapbtns"><button type="button" id="fitAll" data-i18n="fitAll">Tutti i punti</button><button type="button" id="fitVen" data-i18n="fitNE">Nord-Est</button><button type="button" id="areaSelect" data-i18n="areaSelect" aria-pressed="false">Seleziona area</button><button type="button" id="areaClear" data-i18n="areaClear" hidden>Rimuovi area</button></div>
      <div id="contourNotice" class="contour-notice" role="status" hidden></div>
      <div class="legend">
        <div class="i"><span class="dot" style="background:var(--gps)"></span><span data-i18n="lgGps">Posizione GPS</span></div>
        <div class="i"><span class="dot" style="background:var(--loc)"></span><span data-i18n="lgLoc">Località riconosciuta</span></div>
        <div class="i"><span class="dot" style="background:var(--prov)"></span><span data-i18n="lgProv">Centro della provincia</span></div>
        <div class="i"><span class="dot" style="background:var(--stato)"></span><span data-i18n="lgStato">Centro dello Stato</span></div>
        <div class="s" data-i18n="lgSize">Area del cerchio ∝ numero di campioni</div>
      </div>
    </div>
  </div>
</div>
<div id="fatal" class="fatal" role="alert" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://unpkg.com/esri-leaflet@3.0.19/dist/esri-leaflet.js"></script>
<script src="https://unpkg.com/esri-leaflet-vector@4.3.2/dist/esri-leaflet-vector.js"></script>
<script>
window.addEventListener('error',function(e){var b=document.getElementById('fatal');if(!b)return;b.hidden=false;b.textContent='Errore nella pagina: '+(e.message||'risorsa non caricata')+(e.filename?' ('+e.filename.split('/').pop()+':'+e.lineno+')':'');});
if(!window.L){document.addEventListener('DOMContentLoaded',function(){var b=document.getElementById('fatal');if(b){b.hidden=false;b.textContent='La libreria della mappa (Leaflet) non si è caricata: controlla la connessione.';}});}
</script>

// URL dell'API di Google Apps Script (deployment /exec)

// Definizione globale per fetchJsonp
window.fetchJsonp = function(url, params = {}) {
  return new Promise((resolve, reject) => {
    const callbackName = 'jsonp_cb_' + Math.floor(Math.random() * 1000000);
    params.callback = callbackName;
    
    const queryString = new URLSearchParams(params).toString();
    const script = document.createElement('script');
    script.src = url + '?' + queryString;

    window[callbackName] = function(data) {
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
      if (data && data.error) {
        reject(new Error(data.error));
      } else {
        resolve(data);
      }
    };

    script.onerror = function() {
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
      reject(new Error('Impossibile caricare i dati dal server Google Apps Script.'));
    };

    document.body.appendChild(script);
  });
};

// Definizione globale di apiCall
window.apiCall = async function(action, params = {}) {
  if (action === 'getData' || action === 'verifyPin' || action === 'searchPhotos') {
    return window.fetchJsonp(API_URL, { action, ...params });
  }

  const payload = { action, ...params };
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error('Errore HTTP ' + res.status);
  const data = await res.json();
  if (data && data.error) throw new Error(data.error);
  return data;
};

// ---------- parsing del foglio ----------
function colIndex(header){
  const h = header.map(x=>norm(x).trim());
  const exact = k=>h.indexOf(k);
  const find = (...keys)=>{for(const k of keys){const i=exact(k);if(i>=0)return i}for(const k of keys){const i=h.findIndex(x=>x.includes(k));if(i>=0)return i}return -1};
  return {id:exact('id'),box:find('nr scatola','scatola'),fam:exact('famiglia'),gen:exact('genere'),sp:exact('specie'),full:exact('genere e specie'),
    aut:exact('autore'),site:find('sito di raccolta','sito','localita'),prov:exact('provincia'),st:exact('stato'),date:exact('data'),
    leg:exact('legit'),det:exact('determinavit'),note:exact('note'),
    gpsLat:exact('latitudine gps'),gpsLon:exact('longitudine gps'),gpsAcc:exact('precisione gps (m)'),
    photos:exact('foto'),insBy:exact('inserito da'),insAt:exact('inserito il'),modBy:exact('modificato da'),modAt:exact('modificato il'), header:h};
}
const num = v=>{const x=parseFloat(String(v??'').replace(',','.'));return isFinite(x)?x:null};
function geocode(site, prov, st, custom, gLat, gLon){
  if(gLat!=null && gLon!=null && Math.abs(gLat)<=90 && Math.abs(gLon)<=180)
    return {lat:gLat,lon:gLon,place:(site||T('gpsPlace')),prec:'gps'};
  const s = site.replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim();
  const ls = s.toLowerCase();
  for(const c of custom){ if(ls.includes(c.text.toLowerCase())) return {lat:c.lat,lon:c.lon,place:c.name,prec:'loc'}; }
  for(const [rx,lat,lon,place] of GAZ_RX){ if(rx.test(s)) return {lat,lon,place,prec:'loc'}; }
  if(PROV[prov]) return {lat:PROV[prov][0],lon:PROV[prov][1],place:T('provinceOf')+PROV[prov][2],prec:'prov'};
  const code = STATE[st]?st:'IT', S = STATE[code];
  return {lat:S[0],lon:S[1],place:(T('states')[code]||S[2]),prec:'stato'};
}
function driveId(u){ const m=String(u).match(/\/d\/([\w-]{20,})|[?&]id=([\w-]{20,})/); return m?(m[1]||m[2]):null; }
function parsePhotos(cell){
  return String(cell||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const [img,credit,page]=l.split(' | ').map(x=>(x||'').trim());
    const id=driveId(img);
    return {img, credit:credit||'', page:page||img, id, thumb:id?('https://drive.google.com/thumbnail?id='+id+'&sz=w480'):img, own:!!id};
  }).filter(p=>p.img.indexOf('https:')===0);
}
function parse(data){
  const c = colIndex(data.header);
  const get=(r,i)=>i>=0&&r[i]!=null?String(r[i]).trim():'';
  const noteCols=[]; if(c.note>=0){ noteCols.push(c.note); for(let k=c.note+1;k<c.header.length&&!c.header[k];k++) noteCols.push(k); }
  recs.length=0;
  data.rows.forEach((r,i)=>{
    let prov=get(r,c.prov).toUpperCase(); if(prov==='UR') prov='VR'; if(prov==='?') prov='';
    let st=get(r,c.st).toUpperCase(); if(st==='IR') st='IT';
    const gen=get(r,c.gen), sp=get(r,c.sp);
    let name = gen&&sp ? gen+' '+sp : get(r,c.full);
    name = name.replace(/\s+/g,' ').trim(); if(name) name=name[0].toUpperCase()+name.slice(1).toLowerCase();
    const date=get(r,c.date);
    const ym=date.match(/(19[5-9]\d|20[0-9]\d)/);
    const dm=date.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);
    const iso = dm && +dm[2]>=1 && +dm[2]<=12 ? `${dm[3]}-${dm[2].padStart(2,'0')}-${dm[1].padStart(2,'0')}` : '';
    const site=get(r,c.site).replace(/\s+/g,' ');
    const gLat=num(get(r,c.gpsLat)), gLon=num(get(r,c.gpsLon));
    const gpsTxt=[get(r,c.gpsLat),get(r,c.gpsLon)].filter(s=>s&&num(s)==null);
    const g=geocode(site,prov,st,data.places||[],gLat,gLon);
    const note = noteCols.map(k=>get(r,k)).concat(gpsTxt).filter(Boolean).join(' · ');
    const rec={i,row:(data.rowNums&&data.rowNums[i])||i+2,id:get(r,c.id),box:get(r,c.box),fam:get(r,c.fam),gen,sp,name,aut:get(r,c.aut),site,prov,st,date,iso,year:ym?+ym[1]:null,
      leg:get(r,c.leg),det:get(r,c.det),note,lat:g.lat,lon:g.lon,place:g.place,prec:g.prec,
      gpsLat:gLat,gpsLon:gLon,gpsAcc:num(get(r,c.gpsAcc)),photos:parsePhotos(get(r,c.photos)),insBy:get(r,c.insBy),insAt:get(r,c.insAt),modBy:get(r,c.modBy),modAt:get(r,c.modAt)};
    rec.key=g.prec==='gps' ? rec.lat.toFixed(5)+','+rec.lon.toFixed(5) : rec.lat+','+rec.lon;
    rec.hay=norm([rec.fam,rec.name,rec.site,rec.place,rec.leg,rec.det,rec.prov].join(' '));
    recs.push(rec);
  });
}

  fillSelect($('#fam'),[...counts('fam')].sort((a,b)=>a[0].localeCompare(b[0])),T('all_f'));
  fillSelect($('#leg'),[...counts('leg')].sort((a,b)=>b[1]-a[1]),T('all_m'));
  fillSelect($('#box'),[...counts('box')].sort((a,b)=>(+a[0]||0)-(+b[0]||0)),T('all_f'));
  const years=recs.map(r=>r.year).filter(Boolean);
  const y0=YMIN,y1=YMAX, keep=+$('#y0').value!==y0 || +$('#y1').value!==y1;
  YMIN=years.length?Math.min(...years):1900; YMAX=years.length?Math.max(...years):2100;
  if(!keep||!$('#y0').value){ $('#y0').value=YMIN; $('#y1').value=YMAX; }
  $('#y0').min=$('#y1').min=YMIN; $('#y0').max=$('#y1').max=YMAX;
}
let selected=null, listLimit=200, openRow=null, mode='browse';
let areaBounds=null, areaDrawing=false, suppressAreaClick=false;
function refreshAreaControls(){
  $('#areaSelect').textContent=T(areaDrawing?'areaCancel':'areaSelect');
  $('#areaSelect').setAttribute('aria-pressed',String(areaDrawing));
  $('#areaSelect').disabled=mode==='form'||!window.L;
  $('#areaClear').hidden=!areaBounds||mode==='form';
}
function cancelAreaSelection(){
  if(!areaDrawing) return;
  areaDrawing=false; M.areaMode(false); refreshAreaControls();
}
function finishAreaSelection(bounds){
  areaBounds=bounds; cancelAreaSelection(); M.showArea(bounds);
  selected=null; openRow=null; listLimit=200; update(false);
}
function filtered(){
  const terms=norm($('#q').value.trim()).split(/\s+/).filter(Boolean);
  const fam=$('#fam').value, leg=$('#leg').value, box=$('#box').value;
  const y0=+$('#y0').value || YMIN, y1=+$('#y1').value || YMAX;
  const yF=y0>YMIN||y1<YMAX;
  const pOk={gps:$('#p-gps').checked,loc:$('#p-loc').checked,prov:$('#p-prov').checked,stato:$('#p-stato').checked};
  const onlyPh=$('#p-photo').checked;
  return recs.filter(r=>{
    if(areaBounds&&!areaBounds.contains([r.lat,r.lon]))return false;
    if(!pOk[r.prec])return false;
    if(onlyPh&&!r.photos.length)return false;
    if(fam&&r.fam!==fam)return false;
    if(leg&&r.leg!==leg)return false;
    if(box&&String(r.box)!==box)return false;
    if(yF&&(!r.year||r.year<y0||r.year>y1))return false;
    for(const t of terms) if(!r.hay.includes(t)) return false;
    return true;
  });
}

// ---------- mappa ----------
const NE_PTS=[[44.9,10.2],[46.8,13.9]];
let M=null, lastGroups=[];
const radiusOf=n=>3.2+Math.sqrt(n)*1.9;
const tipHtml=e=>'<div><b>'+esc(e.place)+'</b><br>'+fmt(e.n)+' '+T('specimens')+' · '+e.species.size+' '+T('species')+(e.ph?' · '+e.ph+' '+T('withPhoto'):'')+'</div>';
function groupsFrom(list){
  const g=new Map();
  list.forEach(r=>{let e=g.get(r.key);if(!e){e={key:r.key,lat:r.lat,lon:r.lon,place:r.place,prec:r.prec,n:0,ph:0,species:new Set()};g.set(r.key,e)}e.n++;if(r.photos.length)e.ph++;e.species.add(r.name)});
  return [...g.values()].sort((a,b)=>b.n-a.n);
}
function drawPoints(list){ lastGroups=groupsFrom(list); if(M) M.draw(lastGroups); }
function mapFit(pts,maxZoom){ if(M&&pts.length) M.fit(pts,maxZoom); }
function mapFitNE(){ mapFit(NE_PTS); }

function leafletEngine(){
  const map=L.map('map',{preferCanvas:true,minZoom:3,maxZoom:19});
  const OSM_ATTR='&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>';
  const ESRI_IMAGERY_ATTR='Powered by <a href="https://www.esri.com/" target="_blank" rel="noopener">Esri</a>';
  const ESRI_HILLSHADE_ATTR='Powered by <a href="https://www.esri.com/" target="_blank" rel="noopener">Esri</a>';
  
  const relief=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,maxNativeZoom:16,zIndex:2,className:'basemap-topo',attribution:ESRI_HILLSHADE_ATTR});
  const TILES={
    road:L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:OSM_ATTR}),
    topo:relief,
    sat:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,className:'basemap-sat',attribution:ESRI_IMAGERY_ATTR})
  };
  TILES.road.addTo(map);

  let layerCtl=null;
  const buildLayers=()=>{
    if(layerCtl) layerCtl.remove();
    const b={}; b[T('baseRoad')]=TILES.road; b[T('baseTopo')]=TILES.topo; b[T('baseSat')]=TILES.sat;
    layerCtl=L.control.layers(b,null,{position:'topleft'}).addTo(map);
  };
  buildLayers();
  map.attributionControl.setPrefix(false);
  const layer=L.layerGroup().addTo(map);
  let pickCb=null, areaRect=null;

  return {
    kind:'leaflet',
    draw(groups){
      layer.clearLayers();
      groups.forEach(e=>{
        const isSel=e.key===selected;
        const m=L.circleMarker([e.lat,e.lon], {
          radius:radiusOf(e.n),
          color:isSel?css('--sel'):css('--'+e.prec),
          weight:isSel?2.5:(e.prec==='gps'?2:1.2),
          fillColor:css('--'+e.prec),
          fillOpacity:isSel?.75:.45,
          bubblingMouseEvents:false
        });
        m.bindTooltip(tipHtml(e),{className:'tt',direction:'top',offset:[0,-4]});
        m.on('click',()=>{ if(pickCb||areaDrawing||suppressAreaClick) return; selectPlace(e.key); });
        m.addTo(layer);
      });
    },
    fit(pts,maxZoom){ map.fitBounds(L.latLngBounds(pts).pad(.1),maxZoom?{maxZoom}:{}); },
    fly(lat,lon,z){ map.flyTo([lat,lon],Math.max(map.getZoom(),z),{duration:.6}); },
    resize(){ map.invalidateSize(); },
    relabel(){ buildLayers(); },
    pick(cb){ pickCb=cb; map.getContainer().classList.toggle('picking',!!cb); },
    areaMode(on){
      map.getContainer().classList.toggle('area-drawing',on);
    },
    showArea(bounds){
      if(areaRect) areaRect.remove();
      areaRect = L.rectangle(bounds, {color:css('--accent'), weight:2, fillOpacity:0.1, interactive:false}).addTo(map);
    },
    clearArea(){
      if(areaRect){ areaRect.remove(); areaRect=null; }
    }
  };
}

function selectPlace(key){
  selected = selected === key ? null : key;
  openRow = null;
  listLimit = 200;
  update(false);
}

function update(fitMap = true){
  const list = filtered();
  drawPoints(list);
  if(fitMap && list.length) {
    const pts = list.map(r => [r.lat, r.lon]);
    mapFit(pts);
  }
  renderPanel(list);
  
  const speciesSet = new Set(list.map(r => r.name));
  const sitesSet = new Set(list.map(r => r.place));
  $('#counts').innerHTML = `<b>${fmt(list.length)}</b> ${T('specimens')} · <b>${fmt(speciesSet.size)}</b> ${T('species')} · <b>${fmt(sitesSet.size)}</b> ${T('sites')}`;
}

function renderPanel(list){
  const panel = $('#panel');
  if(!list.length){
    panel.innerHTML = `<div class="empty">${T('noMatch')}</div>`;
    return;
  }

  if(selected){
    const placeRecs = list.filter(r => r.key === selected);
    const placeName = placeRecs[0] ? placeRecs[0].place : '';
    let html = `<button type="button" class="back" id="backToSites">${T('allSites')}</button>`;
    html += `<h2>${esc(placeName)}</h2>`;
    html += `<div class="specs">`;
    placeRecs.forEach(r => {
      html += `<details class="sp"${openRow === r.row ? ' open' : ''}>`;
      html += `<summary><span class="bn">${esc(r.name)} <small>${esc(r.aut)}</small></span><span class="box">${esc(r.fam)}</span></summary>`;
      html += `<dl class="label">
        <dt>${T('lSite')}</dt><dd>${esc(r.site)}</dd>
        <dt>${T('lDate')}</dt><dd>${esc(r.date || T('dateNA'))}</dd>
        <dt>${T('lLegit')}</dt><dd>${esc(r.leg || T('legUnknown'))}</dd>
        <dt>${T('lDet')}</dt><dd>${esc(r.det)}</dd>
        ${r.note ? `<dt>${T('lNote')}</dt><dd>${esc(r.note)}</dd>` : ''}
      </dl>`;
      html += `</details>`;
    });
    html += `</div>`;
    panel.innerHTML = html;
    $('#backToSites').onclick = () => { selected = null; update(false); };
    return;
  }

  // Lista luoghi
  const groups = groupsFrom(list);
  let html = `<h3>${T('siteList')}</h3><div class="places">`;
  groups.slice(0, listLimit).forEach(g => {
    html += `<button type="button" class="place" data-key="${esc(g.key)}">
      <span class="dot" style="background:var(--${g.prec})"></span>
      <span>${esc(g.place)}</span>
      <span class="n">${fmt(g.n)}</span>
    </button>`;
  });
  html += `</div>`;
  panel.innerHTML = html;

  panel.querySelectorAll('.place').forEach(btn => {
    btn.onclick = () => selectPlace(btn.dataset.key);
  });
}

function initApp(data){
  LAST_DATA = data;
  parse(data);
  setupControls();
  if(!M) M = leafletEngine();
  update(true);
}

// Collegamento Eventi
$('#q').oninput = () => update(false);
$('#fam').onchange = () => update(false);
$('#leg').onchange = () => update(false);
$('#box').onchange = () => update(false);
$('#y0').onchange = () => update(false);
$('#y1').onchange = () => update(false);
$('#p-gps').onchange = () => update(false);
$('#p-loc').onchange = () => update(false);
$('#p-prov').onchange = () => update(false);
$('#p-stato').onchange = () => update(false);
$('#p-photo').onchange = () => update(false);

$('#reset').onclick = () => {
  $('#filters').reset();
  $('#p-gps').checked = $('#p-loc').checked = $('#p-prov').checked = $('#p-stato').checked = true;
  $('#p-photo').checked = false;
  areaBounds = null;
  if(M) M.clearArea();
  refreshAreaControls();
  update(true);
};

$('#reload').onclick = () => {
  window.apiCall('getData').then(data => initApp(data)).catch(e => alert("Errore ricaricamento: " + e.message));
};

$('#fitAll').onclick = () => update(true);
$('#fitVen').onclick = () => mapFitNE();

$('#pinBtn').onclick = async () => {
  if (MY_PIN) {
    MY_PIN = '';
    sessionStorage.removeItem('herbarium_pin');
    alert(T('pinExit'));
    location.reload();
  } else {
    const p = prompt(T('pinPrompt'));
    if (!p) return;
    try {
      const res = await window.apiCall('verifyPin', { pin: p });
      if (res && res.valid) {
        MY_PIN = p;
        sessionStorage.setItem('herbarium_pin', p);
        alert(T('pinSuccess'));
        location.reload();
      } else {
        alert(T('pinErr'));
      }
    } catch(err) {
      alert("Errore: " + err.message);
    }
  }
};

// Avvio automatico al caricamento della pagina
document.addEventListener('DOMContentLoaded', () => {
  window.apiCall('getData')
    .then(data => {
      console.log('Dati ricevuti con successo:', data);
      initApp(data);
    })
    .catch(err => {
      console.error('Errore nel caricamento:', err);
      const fatal = $('#fatal');
      if(fatal){ fatal.hidden = false; fatal.textContent = "Errore di caricamento dati: " + err.message; }
    });
});

})();
</script>
